name: ランキングの順位を記録

# 毎日 JST 0:05 に、連続記録ランキングの順位を Firestore に保存する（1週間前との比較用）。
# プルリクエストでは動かさない（フォークからの PR に Secret を渡さないため）。
on:
  schedule:
    - cron: '5 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ranking-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check google-cloud-firestore==2.27.0

      - name: Record ranking snapshot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/snapshot_ranking.py
